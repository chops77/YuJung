biography:
  en: >-
    A Century of Grace and Love: In Loving Memory of Yu-Jung Chao (1928–2026)


    Yu-Jung Chao lived a full and meaningful century. With resilient grace, boundless kindness, and a steadfast Christian faith, she wove a lifetime of quiet devotion, warmth, and enduring love.


    Born in mainland China, she lived through times of war and turmoil before relocating with her husband to Taiwan, where they raised one son and two daughters. During difficult years, their family home was destroyed by a devastating fire, leaving them with nothing. Through the compassionate support and grace of the church, they weathered the storm—a turning point that anchored her unwavering faith in God for the rest of her life. Following the untimely passing of her husband, she shouldered the entire family on her own with her sewing needle and hardworking hands. She rose early each morning to prepare nourishing meals and faithfully delivered warm lunches to her children at school. Despite the hardships, she remained remarkably gentle, eager to learn, and always mindful never to burden others, safeguarding her family through every season of life.


    The second half of her life was like a warm candle—giving of herself to illuminate the lives of those she loved. Whether supporting her adult children or tenderly caring for her daughter-in-law during times of illness and postpartum recovery, she offered the deep, unconditional comfort of a mother’s embrace. Later, to support her children in the United States, she courageously crossed the Pacific to plant new roots in an unfamiliar land. With equal warmth and devotion, she helped nurture each of her grandchildren, binding the entire family together with generosity and patience. Over time, her children and grandchildren built their lives and families in the United States—a flourishing legacy born of her lifelong sacrifice.


    In the summer of 2026, marking a remarkable milestone of 100 years, her children and grandchildren gathered by her side to sing "Happy Birthday." Looking at the generations surrounding her, she smiled and shared words that will forever remain in our hearts: "This is the happiest day of my life." In that tender moment, all the love she had given throughout a century returned to her in full measure.


    On August 2, 2026, surrounded by the love, presence, and prayers of her family, she peacefully rested from her earthly labors and went home to be with the Lord.


    Yu-Jung’s strength, gentle kindness, humility, and sacrificial love remain our family’s most treasured legacy. We take comfort in knowing she is now in the everlasting embrace of our Heavenly Father, resting in eternal peace and joy until we meet again.


    “I have fought the good fight, I have finished the race, I have kept the faith.” — 2 Timothy 4:7
  zh_tw: >-
    百年慈暉，愛灑人間——追思 曹玉蓉 女士（1928–2026）


    曹玉蓉女士一生跨越整整一個世紀，以堅毅的生命力、溫柔良善的心性與對上帝無比虔誠的信仰，譜寫了一曲動人而溫暖的慈愛之歌。


    她出生於中國大陸，歷經戰亂與遷徙，後隨夫婿定居臺灣，含辛茹苦育養一兒兩女。生活清貧之際，家園曾遭祝融吞噬，全家頓失所依，所幸在教會的扶持與恩典中走出低谷，這份信仰也成為她一生的力量源泉。夫婿早逝後，她獨自以針線與雙手撐起整個家，每天早起料理營養餐食、準時為求學的孩子送上熱騰騰的便當。生活雖艱辛，她卻始終性情溫柔、樂於向學、從不輕易給人添麻煩，用無盡的母愛守護著家庭的每一步。


    她的下半生，如同燃燒自己、照亮家人的溫暖燭火。無論是兒女成家立業、或是媳婦做月子與生病之時，她總是無微不至地傾注照料，給予了如親生母親般的溫暖與依靠。隨後，為了陪伴遠赴美國發展的家人，她毅然跨越重洋，在陌生的國度扎根生活。她不偏不倚地悉心呵護著每一位孫輩的成長，用寬厚與善良將家族緊緊凝聚在一起。日後，子孫們陸續來到美國求學、成家，枝繁葉茂，處處皆是她一生耕耘與奉獻的結實果實。


    2026年盛夏，在走過豐盛的一百年歲月之際，全體兒孫齊聚床前，圍繞著她唱響百歲生日的祝福之歌。面對滿堂至親，她欣慰地說出：「這是我最快樂的一天。」那是她一生給予的所有愛意，最終化為滿滿的感激與依戀，重新回到了她的懷抱。


    2026年8月2日，她在兒孫的深情陪伴與禱告中安詳歇了世上的勞苦，蒙主恩召，歸回天家。


    玉蓉女士一生的堅韌、善良、謙和與奉獻，已化為家族最珍貴的精神遺產。我們深信，她如今已在天父懷中得享永遠的平安與喜樂，直到未來在主裡再次相聚。


    「那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。」（提摩太後書 4:7）
  zh_cn: >-
    百年慈晖，爱洒人间——追思 曹玉蓉 女士（1928–2026）


    曹玉蓉女士一生跨越整整一个世纪，以坚毅的生命力、温柔良善的心性与对上帝无比虔诚的信仰，谱写了一曲动人而温暖的慈爱之歌。


    她出生于中国大陆，历经战乱与迁徙，后随夫婿定居台湾，含辛茹苦育养一儿两女。生活清贫之际，家园曾遭祝融吞噬，全家顿失所依，所幸在教会的扶持与恩典中走出低谷，这份信仰也成为她一生的力量源泉。夫婿早逝后，她独自以针线与双手撑起整个家，每天早起料理营养餐食、准时为求学的孩子送上热腾腾的便当。生活虽艰辛，她却始终性情温柔、乐于向学、从不轻易给人添麻烦，用无尽的母爱守护着家庭的每一步。


    她的下半生，如同燃烧自己、照亮家人的温暖烛火。无论是儿女成家立业、或是媳妇做月子与生病之时，她总是无微不至地倾注照料，给予了如亲生母亲般的温暖与依靠。随后，为了陪伴远赴美国发展的家人，她毅然跨越重洋，在陌生的国度扎根生活。她不偏不倚地悉心呵护着每一位孙辈的成长，用宽厚与善良将家族紧紧凝聚在一起。日后，子孙们陆续来到美国求学、成家，枝繁叶茂，处处皆是她一生耕耘与奉献的结实果实。


    2026年盛夏，在走过丰盛的一百年岁月之际，全体儿孙齐聚床前，围绕着她唱响百岁生日的祝福之歌。面对满堂至亲，她欣慰地说出：“这是我最快乐的一天。”那是她一生给予的所有爱意，最终化为满满的感激与依恋，重新回到了她的怀抱。


    2026年8月2日，她在儿孙的深情陪伴与祷告中安详歇了世上的劳苦，蒙主恩召，归回天家。


    玉蓉女士一生的坚韧、善良、谦和与奉献，已化为家族最珍贵的精神遗产。我们深信，她如今已在天父怀中得享永远的平安与喜乐，直到未来在主里再次相聚。


    “那美好的仗我已经打过了，当跑的路我已经跑尽了，所信的道我已经守住了。”—— 提摩太后书 4:7
